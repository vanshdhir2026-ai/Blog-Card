<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <link rel="stylesheet" href="style.css">

  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <section id="container">
      <div id="white-box">
      <div id="img-box">
        <img src="./assets/images/illustration-article.svg" alt="illustration">
      </div>
      <span id="learning" class="same-color">learning</span>
      <p id="publish">Published 21 dec 2023</p>
      <h3 id="title" class="same-color">HTML & CSS foundations</h3>
      <p id="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
      <div id="profile">
        <img src="./assets/images/image-avatar.webp" alt="avatar">
        <span id="name" class="same-color">Greg hooper</span>
      </div>
    </div>
  </section>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
